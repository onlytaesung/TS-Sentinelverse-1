<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>대한민국센티널관리본부</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="css">
/* 레이아웃: 기밀 관제 단말 — 어두운 작전실 화면, 모서리 브래킷 패널, 한 열 흐름 (모바일 우선). 한 가지 어두운 테마로 고정 */
:root{
  --bg:#0A0E13; --surface:#11171E; --surface2:#161E27; --line:#223040; --line2:#2E4054;
  --fg:#E8EEF4; --muted:#8392A4; --dim:#56657A;
  --sen:#FF6A3D; --sen-soft:rgba(255,106,61,.13); --gui:#2ED6C3; --gui-soft:rgba(46,214,195,.12);
  --warn:#F5B942; --ok:#5BD98C; --danger:#FF3B52;
  --f-display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px;
  background-image:
    radial-gradient(900px 420px at 85% -10%,rgba(255,106,61,.10),transparent 60%),
    radial-gradient(800px 420px at -10% 10%,rgba(46,214,195,.08),transparent 60%),
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:auto,auto,32px 32px,32px 32px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:740px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.08em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.row:focus-visible{outline:2px solid var(--sen);outline-offset:2px}

/* 모서리 브래킷 패널 */
.panel,.stat,.list,.log,.card,.quiz{position:relative;background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:4px}
.panel::before,.stat::before,.list::before,.log::before,.card::before,.quiz::before,
.panel::after,.stat::after,.list::after,.log::after,.card::after,.quiz::after{content:"";position:absolute;width:10px;height:10px;pointer-events:none;z-index:2}
.panel::before,.stat::before,.list::before,.log::before,.card::before,.quiz::before{top:-1px;left:-1px;border-top:2px solid var(--fg);border-left:2px solid var(--fg)}
.panel::after,.stat::after,.list::after,.log::after,.card::after,.quiz::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--fg);border-right:2px solid var(--fg)}

/* 헤더 */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(180deg,var(--bg) 82%,rgba(10,14,19,0));padding-block:0 14px}
.classified{display:flex;justify-content:space-between;gap:8px;align-items:center;font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;color:var(--sen);border-bottom:1px solid rgba(255,106,61,.35);padding-block:8px 6px;margin-bottom:14px;white-space:nowrap;overflow:hidden}
.classified b{font-weight:500;background:var(--sen);color:var(--bg);padding:1px 6px;border-radius:2px;letter-spacing:.12em}
.classified span:last-child{color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.logo{width:46px;height:46px;flex:none;filter:drop-shadow(0 0 10px rgba(255,106,61,.25))}
.brand h1{font-size:25px;line-height:1.1;letter-spacing:.02em}
.brand small{display:block;font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.22em;margin-top:5px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:4px;background:rgba(17,23,30,.85);overflow:hidden}
.tab{border:0;border-left:1px solid var(--line);background:transparent;padding:11px 4px 10px;font-weight:600;font-size:14px;color:var(--muted);position:relative;letter-spacing:.02em}
.tab:first-child{border-left:0}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);background:linear-gradient(180deg,rgba(255,106,61,.16),rgba(255,106,61,0))}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--sen);box-shadow:0 0 12px var(--sen)}

section.view{display:flex;flex-direction:column;gap:22px;padding-top:6px}
[hidden]{display:none!important}

/* 센터 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{padding:12px 14px 10px}
.stat .label{display:block}
.stat b{display:block;font-family:var(--f-display);font-size:34px;font-weight:400;line-height:1.15;margin-top:2px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}

.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:11px;font-weight:500;padding:1px 7px;border-radius:2px;white-space:nowrap;letter-spacing:.04em;border:1px solid transparent}
.chip.s{background:var(--sen-soft);color:var(--sen);border-color:rgba(255,106,61,.35)}
.chip.g{background:var(--gui-soft);color:var(--gui);border-color:rgba(46,214,195,.35)}
.chip.ok{color:var(--ok);padding-inline:0}
.chip.warn{color:var(--warn);padding-inline:0}
.chip.new{color:var(--gui);padding-inline:0}
.chip.danger{color:var(--danger);padding-inline:0;font-weight:600}
.chip.danger .dot{animation:blink .8s steps(2,start) infinite}
.bar i.d{background:var(--danger);box-shadow:0 0 10px var(--danger);animation:dbar 1.6s ease-in-out infinite}
@keyframes dbar{50%{opacity:.55}}
button.row.danger{background:linear-gradient(90deg,rgba(255,59,82,.10),transparent 70%)}
.card.danger{border-color:rgba(255,59,82,.55);animation:dcard 2.4s ease-in-out infinite}
@keyframes dcard{50%{box-shadow:0 0 0 1px rgba(255,59,82,.45),0 0 26px rgba(255,59,82,.28)}}
.danger-note{color:var(--danger)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.chip.warn .dot{animation:blink 1.4s steps(2,start) infinite}
@keyframes blink{to{opacity:.25}}

.block h2{font-size:21px;margin-bottom:10px;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.block h2::before{content:"";width:8px;height:8px;background:var(--sen);transform:rotate(45deg) translateY(-3px);flex:none}
.block h2 small{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.list{overflow:hidden}
.row{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-child{border-top:0}
button.row{transition:background .15s}
button.row:hover{background:rgba(255,255,255,.035)}
.mono-av{width:42px;height:42px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:20px;overflow:hidden;flex:none;border:1px solid currentColor}
.mono-av.s{background:var(--sen-soft);color:var(--sen)}
.mono-av.g{background:var(--gui-soft);color:var(--gui)}
.mono-av img,.photo img{width:100%;height:100%;object-fit:cover;display:block}
.row .info{min-width:0}
.row .info b{font-weight:600;margin-right:4px}
.row .info span.sub{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.bar{width:68px;height:4px;border-radius:0;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.bar i.w{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.bar i.lo{background:var(--dim);box-shadow:none}
.verdict{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.06em}
.verdict.no{color:var(--dim);text-decoration:line-through}
.verdict.wait{color:var(--gui)}
.verdict.yes{color:var(--sen);font-weight:600}
.match-pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:18px 14px 8px}
.match-pair .who{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.match-pair .mono-av{width:72px;height:72px;font-size:30px}
.match-pair .who b{font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.1}
.match-pct{font-family:var(--f-display);font-size:50px;line-height:1;color:var(--sen);text-shadow:0 0 18px rgba(255,106,61,.55);text-align:center}
.match-pct small{display:block;font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.14em;text-shadow:none;margin-top:6px}

.log{list-style:none;margin:0;padding:4px 0}
.log li{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:9px 14px;font-size:14px;border-top:1px dashed var(--line)}
.log li:first-child{border-top:0}
.log time{color:var(--sen);font-size:11px;padding-top:3px;font-family:var(--f-mono);letter-spacing:.04em}

/* 요원 카드 */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:600px){.cards{grid-template-columns:minmax(0,1fr)}}
.card{overflow:visible;transition:box-shadow .3s}
.card.flash{box-shadow:0 0 0 2px var(--sen),0 0 24px rgba(255,106,61,.4)}
.card-top{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.card.s .card-top{background:linear-gradient(90deg,rgba(255,106,61,.18),transparent)}
.card.g .card-top{background:linear-gradient(90deg,rgba(46,214,195,.16),transparent)}
.card-top .issuer{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--muted);margin-bottom:3px}
.card-top .chip{background:transparent!important}
.card-top .code{font-size:12px;color:var(--fg);letter-spacing:.08em;border:1px solid var(--line2);padding:2px 7px;border-radius:2px}
.card-id{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:16px 14px 6px}
.ph-col{display:flex;flex-direction:column;align-items:center;gap:6px}
.photo{width:82px;height:108px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:40px;border:1px dashed currentColor;overflow:hidden;background:rgba(255,255,255,.02)}
.photo.has{border:1px solid currentColor}
.card.s .photo{color:var(--sen)} .card.g .photo{color:var(--gui)}
.ph-tools{display:flex;gap:4px}
.ph-tools button{border:1px solid var(--line2);background:var(--surface);border-radius:2px;font-size:11px;padding:2px 7px;color:var(--muted)}
.ph-tools button:hover{border-color:var(--sen);color:var(--fg)}
.card-id h3{font-size:32px;line-height:1.1}
.card-id .label{display:block;margin-top:4px;font-family:var(--f-body);font-size:12.5px;letter-spacing:0;color:var(--muted)}
.grade{font-family:var(--f-display);font-size:52px;line-height:1;text-align:center}
.card.s .grade{color:var(--sen);text-shadow:0 0 18px rgba(255,106,61,.55)}
.card.g .grade{color:var(--gui);text-shadow:0 0 18px rgba(46,214,195,.5)}
.grade small{display:block;font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.14em;text-shadow:none;margin-top:2px}
dl.facts{margin:0;padding:10px 14px 16px;display:grid;grid-template-columns:76px 1fr;gap:8px 12px;font-size:14px}
dl.facts dt{color:var(--muted);font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;padding-top:3px}
dl.facts dd{margin:0;min-width:0}
.meter{display:flex;align-items:center;gap:8px}
.meter .bar{flex:1;width:auto}
.edit-note{font-size:13px;color:var(--muted);background:rgba(255,106,61,.06);border:1px dashed rgba(255,106,61,.4);border-radius:4px;padding:10px 14px;margin:0}

/* 매칭 테스트 */
.quiz{padding:22px 20px}
.progress{display:flex;gap:4px;margin-bottom:18px}
.progress i{flex:1;height:3px;background:var(--line)}
.progress i.on{background:var(--sen);box-shadow:0 0 8px var(--sen)}
.quiz h2{font-size:26px;margin:6px 0 18px}
.opts{display:grid;gap:8px;counter-reset:opt}
.opt{border:1px solid var(--line);background:rgba(255,255,255,.02);border-radius:3px;padding:12px 14px;text-align:left;font-size:15px;display:flex;gap:12px;align-items:center;transition:border-color .15s,background .15s}
.opt::before{counter-increment:opt;content:counter(opt,upper-alpha);font-family:var(--f-mono);font-size:12px;color:var(--sen);border:1px solid rgba(255,106,61,.45);width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex:none;border-radius:2px}
.opt:hover{border-color:var(--sen);background:rgba(255,106,61,.07)}
.intro p{color:var(--muted);margin:6px 0 18px;max-width:60ch}
.go{border:0;background:var(--sen);color:#120806;border-radius:3px;padding:12px 22px;font-weight:700;letter-spacing:.04em;box-shadow:0 0 20px rgba(255,106,61,.35)}
.go:hover{filter:brightness(1.08)}
.ghost{border:1px solid var(--line2);background:transparent;border-radius:3px;padding:11px 18px;font-weight:500}
.ghost:hover{border-color:var(--fg)}

.result{display:flex;flex-direction:column;gap:18px}
.res-grade{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.res-grade .big{font-family:var(--f-display);font-size:76px;line-height:1;width:92px;height:104px;border-radius:3px;display:flex;align-items:center;justify-content:center;border:1px solid currentColor}
.res-grade .big.s{background:var(--sen-soft);color:var(--sen);text-shadow:0 0 22px rgba(255,106,61,.6)}
.res-grade .big.g{background:var(--gui-soft);color:var(--gui);text-shadow:0 0 22px rgba(46,214,195,.55)}
.res-grade h2{font-size:28px;margin:2px 0 2px}
.res-match{border-top:1px dashed var(--line2);padding-top:18px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.res-match .mono-av{width:58px;height:58px;font-size:26px}
.res-match .pct{font-family:var(--f-display);font-size:40px;line-height:1;color:var(--sen);text-shadow:0 0 16px rgba(255,106,61,.5)}
.res-note{font-size:14px;color:var(--muted);margin:0}
.res-btns{display:flex;gap:8px;flex-wrap:wrap}
footer{margin-top:32px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;color:var(--dim);text-align:center;border-top:1px solid var(--line);padding-top:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface2);color:var(--fg);border:1px solid var(--sen);padding:9px 16px;border-radius:3px;font-size:14px;z-index:20;max-width:calc(100% - 32px);box-shadow:0 0 20px rgba(255,106,61,.3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* 신규 요원 등록 알림 */
.alert{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.alert-back{position:absolute;inset:0;background:rgba(4,7,10,.8);backdrop-filter:blur(3px);animation:fadein .4s}
.alert-box{position:relative;width:min(420px,100%);max-height:100%;overflow:auto;background:var(--bg);border:1px solid var(--gui);border-radius:4px;padding:16px;box-shadow:0 0 0 1px rgba(46,214,195,.2),0 0 44px rgba(46,214,195,.35);animation:popin .55s cubic-bezier(.2,.9,.3,1.15)}
.alert-head{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;color:var(--gui);border-bottom:1px solid rgba(46,214,195,.35);padding-bottom:8px;margin-bottom:12px;white-space:nowrap}
.alert-head .mono{margin-left:auto;color:var(--muted)}
.siren{width:8px;height:8px;border-radius:50%;background:var(--gui);box-shadow:0 0 10px var(--gui);animation:blink .7s steps(2,start) infinite;flex:none}
.alert-box h2{font-size:26px;margin-bottom:2px}
.alert-sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.alert-card{overflow:hidden}
.scan{position:absolute;left:0;right:0;height:45%;top:-45%;background:linear-gradient(180deg,transparent,rgba(46,214,195,.25),transparent);animation:scan 1.5s ease-out .35s 2;pointer-events:none;z-index:3}
.alert .res-btns{margin-top:14px}
.alert .go{background:var(--gui);box-shadow:0 0 20px rgba(46,214,195,.4)}
@keyframes popin{from{opacity:0;transform:scale(.9) translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}}
@keyframes scan{to{top:100%}}
.fresh{animation:fresh 1.3s ease-in-out 4}
@keyframes fresh{50%{box-shadow:inset 0 0 0 1px var(--gui),0 0 22px rgba(46,214,195,.35);background-color:rgba(46,214,195,.08)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* 접속 보안 게이트 */
body.locked{overflow:hidden}
.gate{position:fixed;inset:0;z-index:40;background:#0A0C0B;display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transition:opacity .5s,filter .5s}
.gate.out{opacity:0;filter:brightness(2.2) blur(2px);pointer-events:none}
.gate-box{--g:#A9E2A8;--gd:#5E8A5B;--gl:#4A6B47;--gw:#E07D6C;position:relative;width:min(560px,100%);border:1px solid var(--gl);padding:clamp(22px,6vw,36px);font-family:var(--f-mono),"IBM Plex Sans KR",monospace;color:var(--g);word-break:keep-all;background:repeating-linear-gradient(0deg,rgba(169,226,168,.035) 0 1px,transparent 1px 4px),#0B0E0C;box-shadow:0 0 40px rgba(169,226,168,.06),inset 0 0 60px rgba(0,0,0,.6)}
.gate-title{font-weight:600;font-size:clamp(14px,3.8vw,17px);letter-spacing:.1em;margin:0 0 8px;text-wrap:balance}
.gate-warn{color:var(--gw);font-size:clamp(12px,3.2vw,14px);letter-spacing:.08em;line-height:1.75;margin:0 0 26px}
.gate-label{color:var(--gd);font-size:13px;letter-spacing:.12em;margin-bottom:6px}
.gate-field{min-height:44px;display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--gl);margin-bottom:22px;font-size:clamp(20px,5.4vw,24px);letter-spacing:.2em}
.gate-field.dots{gap:10px}
.gate-field.dots b{width:16px;height:16px;border-radius:50%;background:var(--g);display:block;animation:dotin .18s ease-out}
@keyframes dotin{from{transform:scale(0)}}
.caret{display:inline-block;width:10px;height:1.1em;background:var(--g);vertical-align:middle;margin-left:6px;animation:blink 1s steps(2,start) infinite}
.gate-btn{width:100%;margin-top:8px;border:0;background:var(--g);color:#0A0C0B;font:inherit;font-weight:700;font-size:clamp(16px,4.4vw,19px);letter-spacing:.3em;padding:15px 10px;cursor:pointer;transition:filter .15s,opacity .2s}
.gate-btn:disabled{opacity:.35;cursor:default}
.gate-btn.ready{animation:gpulse 1.6s ease-in-out infinite}
.gate-btn:not(:disabled):hover{filter:brightness(1.1)}
.gate-btn:focus-visible{outline:2px solid var(--g);outline-offset:3px}
@keyframes gpulse{50%{box-shadow:0 0 0 4px rgba(169,226,168,.18),0 0 28px rgba(169,226,168,.35)}}
.gate-log{margin-top:18px;font-size:14px;letter-spacing:.1em;line-height:1.9;min-height:6em}
.gate-log .ok{color:#fff;background:rgba(169,226,168,.18);padding:0 6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* 폭주 위험 경보 */
.alert.red .alert-back{background:rgba(22,3,7,.84);animation:fadein .4s,redpulse 1.1s ease-in-out 4}
@keyframes redpulse{50%{background:rgba(80,8,20,.86)}}
.alert.red .alert-box{border-color:var(--danger);box-shadow:0 0 0 1px rgba(255,59,82,.25),0 0 54px rgba(255,59,82,.42);animation:popin .55s cubic-bezier(.2,.9,.3,1.15),shake .45s ease .6s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.alert.red .alert-head{color:var(--danger);border-bottom-color:rgba(255,59,82,.45)}
.alert.red .siren{background:var(--danger);box-shadow:0 0 12px var(--danger);animation-duration:.45s}
.alert.red .alert-box h2{color:var(--danger);text-shadow:0 0 18px rgba(255,59,82,.5)}
.alert.red .scan{background:linear-gradient(180deg,transparent,rgba(255,59,82,.3),transparent)}
.alert.red .go{background:var(--danger);color:#fff;box-shadow:0 0 22px rgba(255,59,82,.5)}
.alert.red .card{border-color:rgba(255,59,82,.6)}
.alert-box{word-break:keep-all}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

let pickFor=null;
function toast(msg,ms=2600){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);if(ms)toast._t=setTimeout(()=>t.hidden=true,ms);}
function pickPhoto(id){pickFor=id;const inp=$("#photo-input");inp.value="";inp.click();}
$("#photo-input").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0];if(!f||!pickFor)return;
  try{const data=await toPhoto(f);const next={...PH,[pickFor]:data};await save(next,`${byId(pickFor).name} 사진을 저장했어요`);}
  catch(err){toast("이 사진은 읽을 수 없어요. JPG나 PNG 파일로 다시 골라 주세요.");}
});
function toPhoto(file){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{const W=360,H=480,c=document.createElement("canvas");c.width=W;c.height=H;
    const r=Math.max(W/im.naturalWidth,H/im.naturalHeight),w=im.naturalWidth*r,h=im.naturalHeight*r;
    c.getContext("2d").drawImage(im,(W-w)/2,(H-h)/2,w,h);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",0.85));};
  im.onerror=()=>{URL.revokeObjectURL(url);rej();};im.src=url;});}
async function removePhoto(id){const next={...PH};delete next[id];await save(next,`${byId(id).name} 사진을 뺐어요`);}
function buildDoc(data){
  const css=document.getElementById("css").textContent;
  const app=document.getElementById("app").textContent;
  return SKEL+"\n"+HEAD+"\n<style id=\"css\">"+css+"</style>\n<script id=\"photo-data\" type=\"application/json\">"+JSON.stringify(data)+"<\/script>\n<script id=\"app\">"+app+"<\/script>\n</body></html>";
}
async function save(data,okMsg){
  if(!ART){toast("이 화면에서는 사진을 저장할 수 없어요.");return;}
  toast("저장하는 중…",0);
  try{await ART.publish(buildDoc(data));toast(okMsg);}
  catch(err){
    const c=err&&err.code;
    if(c==="conflict")return;
    toast(c==="not_writer"||c==="not_granted"?"편집 권한이 있는 사람만 사진을 바꿀 수 있어요.":"저장하지 못했어요. 잠시 후 다시 해 주세요.");
  }
}

let step=0,ans=[],lastBest=null;
function renderTest(){
  const v=$("#v-test");
  if(step===0){
    v.innerHTML=`<div class="quiz intro"><span class="label">대한민국센티널관리본부 · 신규 각성자 검사</span>

      <button class="go" id="start">검사 시작</button></div>`;
    $("#start").onclick=()=>{ans=[];step=1;renderTest();};return;
  }
  if(step<=Q.length){
    const q=Q[step-1];
    v.innerHTML=`<div class="quiz"><div class="progress">${Q.map((_,i)=>`<i class="${i<step?"on":""}"></i>`).join("")}</div>
      <span class="label mono">Q${step} / ${Q.length}</span><h2>${q.q}</h2>
      <div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${o[0]}</button>`).join("")}</div></div>`;
    v.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ans.push(q.o[b.dataset.i][1]);step++;renderTest();});
    return;
  }
  let s=0,g=0,p=0,tr={};
  ans.forEach(a=>{s+=a.s||0;g+=a.g||0;p+=a.p||0;if(a.t)tr[a.t]=(tr[a.t]||0)+1;});
  const role=s>g?"s":"g";
  const grade=p>=5?"S":p>=3?"A":p>=2?"B":"C";
  const pool=live().filter(a=>a.role!==role);
  let best=pool[0],bs=-1;
  pool.forEach(a=>{let sc=0;for(const k in LIKES[a.id])sc+=(tr[k]||0)*LIKES[a.id][k];if(sc>bs){bs=sc;best=a;}});
  const rate=Math.min(97,71+bs*4);
  lastBest=best.id;
  v.innerHTML=`<div class="quiz result">
    <span class="label">검사 결과</span>
    <div class="res-grade"><div class="big ${role}">${grade}</div>
      <div><span class="label">판정</span><h2>${grade}급 ${roleTxt(role)}</h2>

      <div class="pct">${rate}%</div></div>
    <p class="res-note">${LINES[best.id]}</p>
    <div class="res-btns"><button class="go" id="retry">다시 검사하기</button><button class="ghost" id="seecard">${best.name} 카드 보기</button></div>
  </div>`;
  $("#retry").onclick=()=>{step=0;ans=[];renderTest();};
  $("#seecard").onclick=()=>flashCard(best.id);
}

function arrive(){
  if(ARRIVED)return;
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  ARRIVE_TIME=`${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  ARRIVED=true;renderCenter();renderCards();markFresh();showAlert();
}
/* 접속 10초 뒤 태산·성호 매칭 결과 */
function showMatch(){
  const al=$("#alert");if(!al.hidden){setTimeout(showMatch,1500);return;}
  const d=new Date(NOW);d.setDate(d.getDate()+7);const hm="15:30";
  MATCH_TIME=`${p2(d.getMonth()+1)}.${p2(d.getDate())} ${hm}`;
  const full=`${d.getFullYear()}.${p2(d.getMonth()+1)}.${p2(d.getDate())} ${hm}`;
  const t=TAESAN_TESTS.find(x=>x.id==="seongho");t.rate=98;t.verdict="적합";
  const ts=byId("taesan"),sh=byId("seongho");
  ts.partner="seongho";ts.note="전담 가이드 성호 지정 · 매칭률 98%";
  sh.partner="taesan";sh.status="매칭";sh.note="태산 전담 가이드 지정 · 매칭률 98%";
  renderCenter();renderCards();
  const a=byId("taesan"),b=byId("seongho");lastFocus=document.activeElement;
  al.innerHTML=`<div class="alert-back"></div>
  <div class="alert-box" role="alertdialog" aria-modal="true" aria-labelledby="alert-title">
    <div class="alert-head"><span class="siren"></span><span>MATCHING RESULT</span><span class="mono">${full}</span></div>

/* 접속 보안 게이트: 코드 자동 입력 후 승인 요청 */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function glog(t){const l=$("#g-log");l.querySelectorAll(".caret").forEach(c=>c.remove());l.insertAdjacentHTML("beforeend",`<div>&gt; ${t}<i class="caret"></i></div>`);}
document.body.classList.add("locked");
(async()=>{
  await sleep(700);
  glog("요원 번호 자동 입력 중");
  for(const ch of "K-0530"){$("#g-id").textContent+=ch;await sleep(120);}
  $("#g-caret").remove();
  await sleep(300);
  for(let i=0;i<4;i++){$("#g-code").insertAdjacentHTML("beforeend","<b></b>");await sleep(170);}
  glog("인가 코드 입력 완료 · 승인 요청 대기");
  const b=$("#g-btn");b.disabled=false;b.classList.add("ready");b.focus({preventScroll:true});
})();
$("#g-btn").onclick=async()=>{
  const b=$("#g-btn");b.disabled=true;b.classList.remove("ready");b.textContent="승인 확인 중…";
  glog("요원 신원 조회 중");await sleep(700);
  glog("K-0530 · 인가 등급 확인 완료");await sleep(600);
  glog('<span class="ok">열람 승인</span>');await sleep(700);
  const g=$("#gate");g.classList.add("out");await sleep(520);
  g.remove();document.body.classList.remove("locked");
  setTimeout(showMatch,10000);
};

/* 편집 권한이 있는 사람에게만 사진 버튼 보이기 */
(async()=>{
  if(!window.claude||!window.claude.use)return;
  try{
    const [art,user]=await Promise.all([window.claude.use("artifact"),window.claude.use("user")]);
    if(!art)return;
    let ok=null;
    if(user){try{ok=await user.canEdit();}catch(e){ok=null;}}
    if(ok===false)return;
    ART=art;CAN_EDIT=true;renderCards();
  }catch(e){}
})();
</script>
